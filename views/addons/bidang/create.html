{{define "header"}}
<div id="kt_app_toolbar_container" class="app-container container-xxl d-flex flex-stack">
    <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
        <h1 class="page-heading d-flex text-gray-900 fw-bold fs-3 flex-column justify-content-center my-0">
            Bidang
        </h1>

        <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
            <li class="breadcrumb-item text-muted">
                <a href="/" class="text-muted text-hover-primary">Beranda</a>
            </li>

            <li class="breadcrumb-item">
                <span class="bullet bg-gray-500 w-5px h-2px"></span>
            </li>

            <li class="breadcrumb-item text-muted">Bidang</li>

            <li class="breadcrumb-item">
                <span class="bullet bg-gray-500 w-5px h-2px"></span>
            </li>

            <li class="breadcrumb-item text-muted">Tambah</li>
        </ul>
    </div>
</div>
{{end}}
{{define "content"}}
<div class="card card-flush pt-3 mb-5 p-6">
    <div class="card-body pt-9 pb-0">
        <form action="/addons/bidang/store" method="POST">
            <div class="row">
                <div class="mb-3">
                    <label for="NamaBidang" class="form-label">Nama Bidang</label>
                    <input type="text" name="NamaBidang" id="NamaBidang" class="form-control" />
                </div>
                <div class="d-flex justify-content-end mt-3">
                    <a href="/addons/bidang" class="btn btn-sm fw-bold btn-secondary me-2">
                        <i class="fa fa-arrow-left fs-2"></i>
                        Back
                    </a>
                    <button class="btn btn-primary btn-sm">
                        <i class="fa fa-square-plus fs-2"></i>
                        Add
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{{end}}
