{{define "header"}}
<div id="kt_app_toolbar_container" class="app-container container-xxl d-flex flex-stack">
    <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
        <h1 class="page-heading d-flex text-gray-900 fw-bold fs-3 flex-column justify-content-center my-0">
            Pegawai
        </h1>

        <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
            <li class="breadcrumb-item text-muted">
                <a href="/" class="text-muted text-hover-primary">Beranda</a>
            </li>

            <li class="breadcrumb-item">
                <span class="bullet bg-gray-500 w-5px h-2px"></span>
            </li>

            <li class="breadcrumb-item text-muted">Pegawai</li>

            <li class="breadcrumb-item">
                <span class="bullet bg-gray-500 w-5px h-2px"></span>
            </li>

            <li class="breadcrumb-item text-muted">Edit</li>
        </ul>
    </div>
    <div class="d-flex align-items-center gap-2 gap-lg-3">
        <a href="/addons/pegawai" class="btn btn-sm fw-bold btn-secondary">
            <i class="fa fa-arrow-left fs-2"></i>
            Back
        </a>
    </div>
</div>
{{end}}
{{define "styles"}}
<style>
    .upload-btn {
        display: inline-block;
        padding: 10px 20px;
        background-color: #007bff;
        color: #fff;
        border-radius: 5px;
        cursor: pointer;
    }

    .upload-btn:hover {
        background-color: #0056b3;
    }

    input[type="file"] {
        display: none;
    }

    .preview {
        margin-top: 20px;
        width: 165px;
        height: 250px;
        border: 2px dashed #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #fff;
    }

    .preview img {
        max-width: 100%;
        max-height: 100%;
        display: block;
    }
</style>
{{end}}
{{define "content"}}
{{range .Flashes}}
<div class="alert alert-{{if eq .status 200}}success{{else}}danger{{end}} alert-dismissible fade show" role="alert"
    data-status="{{.status}}">
    {{.message}}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{{end}}
<div class="card card-flush pt-3 mb-5 p-6">
    <div class="card-body pt-9 pb-0">
        <form action="/addons/pegawai/update/{{.pegawai.Id}}" method="POST" enctype="multipart/form-data">
            <div class="row">
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label for="Name" class="form-label">Nama Pegawai</label>
                        <input type="text" name="Name" id="Name" class="form-control" value="{{.pegawai.Name}}" />
                    </div>
                    <div class="mb-3">
                        <label for="IdPegawai" class="form-label">ID Pegawai</label>
                        <input type="text" name="IdPegawai" id="IdPegawai" class="form-control"
                            value="{{.pegawai.IdPegawai}}" />
                    </div>
                    <div class="mb-3">
                        <label for="BidangID" class="form-label">Pemegang Aset</label>
                        <select id="BidangID" name="BidangID" class="form-select" data-control="select2"
                            data-placeholder="Pilih Bidang">
                            <option></option>
                            {{range .bidang}}
                            <option value="{{.ID}}" {{if and $.pegawai.BidangID (eq .ID
                                $.pegawai.BidangID)}}selected{{end}}>{{.NamaBidang}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="JenisPegawai" class="form-label">Jenis Pegawai</label>
                        <input type="text" name="JenisPegawai" id="JenisPegawai" class="form-control"
                            value="{{.pegawai.JenisPegawai}}" />
                    </div>
                    <div class="mb-3">
                        <label for="Jabatan" class="form-label">Jabatan</label>
                        <input type="text" name="Jabatan" id="Jabatan" class="form-control"
                            value="{{.pegawai.Jabatan}}" />
                    </div>
                    <div class="d-flex justify-content-end mt-3">
                        <a href="/addons/pegawai" class="btn btn-sm fw-bold btn-secondary me-2">
                            <i class="fa fa-arrow-left fs-2"></i>
                            Back
                        </a>
                        <button class="btn btn-success btn-sm">
                            <i class="fa fa-floppy-disk fs-2"></i>
                            Simpan
                        </button>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label class="upload-btn" for="fileInput">
                            <i class="fa fa-file-arrow-up text-white"></i> Upload Foto
                        </label>
                        <input type="file" id="fileInput" name="Foto" accept="image/*" value="{{.pegawai.Foto}}"
                            onchange="handlePreviewImage(event)">
                        <div class="preview" id="previewContainer">
                            <img id="previewImage" src="http://localhost:8080/{{.pegawai.Foto}}" alt="Preview Gambar">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{{end}}
{{define "scripts"}}
<script>
    function handlePreviewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const imgElement = document.getElementById("previewImage");
                imgElement.src = e.target.result;
                imgElement.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    }
</script>
{{end}}
