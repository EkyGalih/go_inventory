{{define "header"}}
<div id="kt_app_toolbar_container" class="app-container container-xxl d-flex flex-stack">
  <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
    <h1 class="page-heading d-flex text-gray-900 fw-bold fs-3 flex-column justify-content-center my-0">
      Aset TIK
    </h1>

    <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
      <li class="breadcrumb-item text-muted">
        <a href="/" class="text-muted text-hover-primary">Beranda</a>
      </li>

      <li class="breadcrumb-item">
        <span class="bullet bg-gray-500 w-5px h-2px"></span>
      </li>

      <li class="breadcrumb-item text-muted">Aset</li>
      <li class="breadcrumb-item">
        <span class="bullet bg-gray-500 w-5px h-2px"></span>
      </li>

      <li class="breadcrumb-item text-muted">Aset TIK</li>
      <li class="breadcrumb-item">
        <span class="bullet bg-gray-500 w-5px h-2px"></span>
      </li>

      <li class="breadcrumb-item text-muted">Distribusi</li>
    </ul>
  </div>
</div>
{{end}}

{{define "content"}}
<div class="card card-flush pt-3 mb-5 pt-10">
  <div class="card-body pt-0">
    <form action="/lokasi-aset/add" method="POST" enctype="multipart/form-data">
      <div class="row">
        <div class="col-lg-6">
          <div class="mb-3">
            <label for="AsetID" class="form-label">Aset</label>
            <select name="AsetID" id="AsetID" class="form-select" data-control="select2" data-placeholder="Pilih Aset">
              <option></option>
              {{ range .asets }}
              <option value="{{ .ID }}" {{ if eq .ID $.SelectedAset}} selected {{end}}>
                {{ .NamaAset }}
              </option>
              {{ end }}
            </select>
          </div>
          <div class="mb-3">
            <label for="pegawai_id" class="form-label">Pemegang Aset</label>
            <select name="pegawai_id" id="pegawai_id" class="form-select" data-control="select2"
              data-placeholder="Pilih Pemegang Aset">
              <option></option>
              {{range .pegawai}}
              <option value="{{.Id}}">{{.Name}} - {{.Nip}}</option>
              {{end}}
            </select>
          </div>
          <div class="mb-3">
            <label for="bidang_id" class="form-label">Bidang</label>
            <select name="bidang_id" id="bidang_id" class="form-select" data-control="select2"
              data-placeholder="Pilih Bidang">
              <option></option>
              {{range .bidang}}
              <option value="{{.Id}}">{{.Nama_Bidang}}</option>
              {{end}}
            </select>
          </div>
          <div class="mb-3">
            <div class="row">
              <div class="col-lg-6">
                <label for="tanggal_perolehan" class="form-label">Tanggal Perolehan</label>
                <input type="date" class="form-control" id="tanggal_perolehan" name="tanggal_perolehan" />
              </div>
              <div class="col-lg-6">
                <label for="tanggal_selesai" class="form-label">Tanggal Selesai</label>
                <input type="date" class="form-control" id="tanggal_selesai" name="tanggal_selesai" />
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="mb-3">
            <label for="jenis_aset" class="form-label">Jenis Aset</label>
            <select name="jenis_pemanfaatan" class="form-select" data-control="select2" data-placeholder="Pilih Jenis">
              <option></option>
              <option value="Tetap">Aset Tetap</option>
              <option value="Habis Pakai">Aset Habis Pakai</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="keterangan" class="form-label">Keterangan</label>
            <textarea name="keterangan" class="form-control" id="keterangan"></textarea>
          </div>
          <div class="d-flex justify-content-end mt-10">
            <a href="/lokasi-aset" class="btn btn-sm fw-bold btn-secondary me-3">
              <i class="ki-duotone ki-arrow-left fs-2">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
              </i>
              Back
            </a>
            <button type="submit" class="btn btn-primary btn-sm">
              <i class="ki-duotone ki-plus fs-2"></i>
              Add
            </button>
          </div>
        </div>
    </form>
  </div>
</div>
{{end}}
