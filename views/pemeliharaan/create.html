{{define "header"}}
<div id="kt_app_toolbar_container" class="app-container container-xxl d-flex flex-stack">
  <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
    <h1 class="page-heading d-flex text-gray-900 fw-bold fs-3 flex-column justify-content-center my-0">
      Pemeliharaan Aset
    </h1>

    <ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
      <li class="breadcrumb-item text-muted">
        <a href="/" class="text-muted text-hover-primary">Beranda</a>
      </li>
      <li class="breadcrumb-item">
        <span class="bullet bg-gray-500 w-5px h-2px"></span>
      </li>
      <li class="breadcrumb-item text-muted">Pemeliharaan Aset</li>
      <li class="breadcrumb-item">
        <span class="bullet bg-gray-500 w-5px h-2px"></span>
      </li>
      <li class="breadcrumb-item text-muted">Tambah</li>
    </ul>
  </div>

  <div class="d-flex align-items-center gap-2 gap-lg-3">
    <a href="/pemeliharaan" class="btn btn-sm fw-bold btn-secondary">
      <i class="fa fa-arrow-left fs-2"></i>
      Back
    </a>
  </div>
</div>
{{end}}

{{define "content"}}
<div class="card card-flush pt-3 mb-5 pt-10">
  <div class="card-body pt-0">
    <form action="/pemeliharaan/store" method="POST" enctype="multipart/form-data">
      <div class="row">
        <div class="col-lg-6">
          <div class="mb-3">
            <label for="nama_aset" class="form-label">Nama Aset</label>
            <select name="AsetID" id="aset_id" class="form-select" data-control="select2"
              data-placeholder="Pilih Aset">
              <option></option>
              {{range .Aset}}
              <option value="{{.ID}}">{{ .NamaAset }} - {{.KodeAset}}</option>
              {{end}}
            </select>
          </div>
          <div class="mb-3">
            <label for="TanggalPemeliharaan" class="form-label">Tanggal Pemeliharaan</label>
            <input type="date" class="form-control" id="TanggalPemeliharaan" name="TanggalPemeliharaan" />
          </div>
          <div class="mb-3">
            <label for="Kerusakan" class="form-label">Kerusakan</label>
            <textarea name="Kerusakan" class="form-control" id="Kerusakan"></textarea>
          </div>
          <div class="mb-3">
            <label for="Perbaikan" class="form-label">Perbaikan</label>
            <textarea name="Perbaikan" class="form-control" id="Perbaikan"></textarea>
          </div>
          <div class="mb-3">
            <label for="Biaya" class="form-label">Biaya Perbaikan</label>
            <input type="text" class="form-control" id="Biaya" name="Biaya" onkeypress="isInputNumber(event)"
              oninput="formatRupiah(this)" />
          </div>
          <div class="mb-3">
            <label for="Keterangan" class="form-label">Keterangan</label>
            <textarea name="Keterangan" class="form-control" id="Keterangan"></textarea>
          </div>
          <div class="d-flex justify-content-end mt-10">
            <button type="reset" class="btn btn-sm fw-bold btn-warning me-3">
              <i class="fa fa-refresh"></i>
              Reset
            </button>
            <button type="submit" class="btn btn-primary btn-sm">
              <i class="fa fa-square-plus"></i>
              Add
            </button>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="mb-3" id="imageContainer">
            <div id="imagePreview" class="d-flex align-items-center justify-content-center"
              style="width: 100%; height: 500px; background-color: #f0f0f0; color: #999; font-size: 20px;">
              No Image
            </div>
          </div>
          <div class="mb-3">
            <label for="gambar" class="form-label">Nota</label>
            <p class="image_upload">
              <label for="userImage">
                <a class="btn btn-primary btn-sm" rel="nofollow">
                  <i class='ki-duotone ki-file-up fs-2 text-white'>
                    <span class="path1"></span>
                    <span class="path2"></span>
                  </i> Upload Nota
                </a>
              </label>
              <input type="file" name="Nota" id="userImage" accept="application/pdf" onchange="loadFilePdf(event)">
            </p>
            <p class="text-info">
              *Upload nota jika perbaikan sudah selesai
            </p>
           <iframe id="pdf" style="width: 100%; height: 600px; border: none;"></iframe>
          </div>
        </div>
    </form>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script type="text/javascript" src="/assets/plugins/custom/ckeditor/ckeditor-classic.bundle.js"></script>
<script>
  $(document).ready(function () {
    $('#aset_id').on('change', function () {
      var id = $(this).val();

      if (!id) {
        $('#imagePreview').replaceWith('<div id="imagePreview" class="d-flex align-items-center justify-content-center" style="width: 100%; height: 500px; background-color: #f0f0f0; color: #999; font-size: 20px;">No Image</div>');
        return;
      }

      $.ajax({
        url: '/pemeliharaan/path/' + id,
        type: 'GET',
        success: function (data) {
          $('#imagePreview').replaceWith('<img id="imagePreview" src="http://localhost:8080/' + data + '" alt="Aset Image" style="width: 100%; height: 500px; object-fit: contain;"/>');
        },
        error: function (xhr, status, error) {
          console.error("Error: " + error);
          $('#imagePreview').replaceWith('<div id="imagePreview" class="d-flex align-items-center justify-content-center" style="width: 100%; height: 500px; background-color: #f0f0f0; color: #999; font-size: 20px;">No Image</div>');
        }
      });
    });

    ClassicEditor.create(document.querySelector("#Kerusakan"), { height: 500 }).catch((error) => { console.error(error); });
    ClassicEditor.create(document.querySelector("#Perbaikan"), { height: 500 }).catch((error) => { console.error(error); });
    ClassicEditor.create(document.querySelector("#Keterangan"), { height: 500 }).catch((error) => { console.error(error); });
  });
</script>
{{end}}
